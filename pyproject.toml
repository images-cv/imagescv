[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "imagescv"
dynamic = ["version"]
description = "Download labeled image datasets in one line of Python."
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "images.cv" }]
keywords = ["dataset", "images", "computer-vision", "machine-learning", "image-classification", "images.cv"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = ["requests>=2.28", "tqdm>=4.60"]

[project.optional-dependencies]
torch = ["torch", "torchvision"]

[project.urls]
Homepage = "https://images.cv"
Documentation = "https://images.cv/dashboard/api-keys"
Source = "https://github.com/images-cv/imagescv"
Issues = "https://github.com/images-cv/imagescv/issues"

[tool.setuptools]
packages = ["imagescv"]

[tool.setuptools.dynamic]
version = { attr = "imagescv._version.__version__" }
